services:
  mugi:
    build:
      context: .
    image: "${MUGI_IMAGE:-mugi:local}"
    restart: unless-stopped
    init: true
    ports:
      - "${MUGI_BIND:-127.0.0.1}:${MUGI_PORT:-8080}:8080"
    environment:
      MUGI_TLS: "${MUGI_TLS:-false}"
      MUGI_ACCESS_MODE: "${MUGI_ACCESS_MODE:-auto}"
    volumes:
      - mugi-certs:/root/.mugi
      - mugi-adb:/root/.android
      - mugi-app-icons:/root/.cache/mugi/app-icons

volumes:
  mugi-certs:
  mugi-adb:
  mugi-app-icons:
